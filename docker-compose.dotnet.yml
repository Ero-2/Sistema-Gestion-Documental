# ══════════════════════════════════════════════════════════
#  Grupo 1 — .NET  (Sistema de Gestión / CalidadSYS)
#  Servicios: dms_sqlserver + dms_dotnet
#  Arrancar:  docker compose -p dms-dotnet -f docker-compose.dotnet.yml --env-file .env up -d --build
#  Detener:   docker compose -p dms-dotnet -f docker-compose.dotnet.yml down
#  Requiere:  red 'dms_backbone' y volumen 'documentos' creados previamente.
# ══════════════════════════════════════════════════════════

services:

  # ── SQL Server 2022 — Fuente maestra ──────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: dms_sqlserver
    environment:
      SA_PASSWORD:  ${MSSQL_SA_PASSWORD}
      ACCEPT_EULA:  "Y"
      MSSQL_PID:    Developer
    ports:
      - "127.0.0.1:${SQLSERVER_PORT:-1435}:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL",
             "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P '${MSSQL_SA_PASSWORD}' -Q 'SELECT 1' -No || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - net_internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G

  # ── .NET Core 10 — Módulo central ─────────────────────────
  # Envía eventos a PHP (vía Nginx) y FastAPI por HTTP.
  # Solo .NET toca SQL Server. Archivos en volumen 'documentos' (r/w).
  dotnet:
    build:
      context: ./src/dotnet-core
    container_name: dms_dotnet
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS:        http://+:8080
      ConnectionStrings__QualityDMS: "Server=sqlserver,1433;Database=${MSSQL_DB:-QualityDMS};User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True"
      Storage__LocalPath:       /app/uploads
      PublicDms__WebhookUrl:    http://dms_fastapi:8000
      PublicDms__ApiKey:        ${FASTAPI_API_KEY}
      PublicDms__PhpSyncUrl:    http://dms_nginx
      DMS_SEED_MODE:            ${DMS_SEED_MODE:-dev}
    ports:
      - "127.0.0.1:${DOTNET_PORT:-5080}:8080"
    volumes:
      - documentos:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - net_internal
      - dms_backbone
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

# ══════════════════════════════════════════════════════════
#  Volúmenes
# ══════════════════════════════════════════════════════════
volumes:
  sqlserver_data:
    name: sqlserver_data
    driver: local
  documentos:
    external: true
    name: documentos

# ══════════════════════════════════════════════════════════
#  Redes
#  net_internal — aislada: solo sqlserver + dotnet
#  dms_backbone — externa compartida: dotnet llama a php/fastapi
#                 por container name (dms_php, dms_fastapi, dms_nginx)
# ══════════════════════════════════════════════════════════
networks:
  net_internal:
    driver: bridge
  dms_backbone:
    external: true
    name: dms_backbone
