# ══════════════════════════════════════════════════════════
#  Grupo 3 — FastAPI  (Motor de búsqueda / Indexación) + Nginx
#  Servicios: dms_mongodb + dms_fastapi + dms_nginx
#  Arrancar:  docker compose -p dms-fastapi -f docker-compose.fastapi.yml --env-file .env up -d --build
#  Detener:   docker compose -p dms-fastapi -f docker-compose.fastapi.yml down
#  Requiere:  red 'dms_backbone' y volumen 'documentos' creados previamente.
#  Nginx = punto de entrada único:
#    :80   → PHP-FPM (dms_php:9000)   | :8443 → FastAPI (dms_fastapi:8000)
#    :8084 → .NET    (dms_dotnet:8080)
# ══════════════════════════════════════════════════════════

services:

  # ── MongoDB 7 — Índice full-text + metadatos ──────────────
  mongodb:
    image: mongo:7
    container_name: dms_mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-mongoadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE:      dms_metadata
    ports:
      - "127.0.0.1:${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongodb_data:/data/db
      - ./db/mongo:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indexer_internal
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  # ── FastAPI (Python 3.12) — Indexación y búsqueda ─────────
  # Recibe eventos de .NET; lee archivos de 'documentos' (r/o).
  fastapi:
    build:
      context: ./src/python-service
    container_name: dms_fastapi
    environment:
      MONGO_URL:         mongodb://${MONGO_USER:-mongoadmin}:${MONGO_PASSWORD}@mongodb:27017/?authSource=admin
      DATABASE_NAME:     dms_metadata
      FASTAPI_API_KEY:   ${FASTAPI_API_KEY}
      JWT_SECRET:        ${JWT_SECRET}
      DOTNET_API_URL:    http://dms_dotnet:8080
      DMS_STORAGE_PATH:  /app/uploads
      # PostgreSQL cross-stack (documents_sync.py) — apunta al stack PHP vía backbone
      POSTGRES_HOST:     ${POSTGRES_HOST:-dms_postgres}
      POSTGRES_PORT:     ${POSTGRES_PORT:-5432}
      POSTGRES_DB:       ${POSTGRES_DB:-PublicDMS}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - documentos:/app/uploads:ro
      - indices_busqueda:/app/indices
    ports:
      - "127.0.0.1:${FASTAPI_PORT:-8001}:8000"
    expose:
      - "8000"
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - indexer_internal
      - dms_backbone
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ── Nginx — Punto de entrada único (reverse proxy + HTTPS) ─
  # Resuelve dms_php / dms_dotnet / dms_fastapi por container name
  # sobre la red dms_backbone (cross-stack).
  nginx:
    build:
      context: ./docker/nginx
    container_name: dms_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-8443}:443"
      - "${NGINX_DOTNET_PORT:-8084}:8084"
    volumes:
      - ./src/php-app:/var/www/html:ro   # SCRIPT_FILENAME + estáticos PHP
      - documentos:/var/dms/uploads:ro
    depends_on:
      - fastapi
    networks:
      - dms_backbone
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M

# ══════════════════════════════════════════════════════════
#  Volúmenes
# ══════════════════════════════════════════════════════════
volumes:
  mongodb_data:
    name: mongodb_data
    driver: local
  indices_busqueda:
    name: indices_busqueda
    driver: local
  documentos:
    external: true
    name: documentos

# ══════════════════════════════════════════════════════════
#  Redes
#  indexer_internal — aislada: solo mongodb + fastapi
#  dms_backbone     — externa compartida: nginx/fastapi ↔ dms_php/dms_dotnet
# ══════════════════════════════════════════════════════════
networks:
  indexer_internal:
    driver: bridge
  dms_backbone:
    external: true
    name: dms_backbone
