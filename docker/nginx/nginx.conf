worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Headers de seguridad reutilizables ─────────────────────────────────────
    map $host $sec_dummy { default 1; }

    # ════════════════════════════════════════════════════════════════════════════
    #  Puerto 80 — Punto de entrada único, ROUTING POR PATH
    #    /php      → PHP-FPM   (portal público)      [strip + X-Forwarded-Prefix]
    #    /fastapi  → FastAPI   (motor de búsqueda)   [strip + X-Forwarded-Prefix]
    #    /dotnet   → .NET      (gestión interna)     [strip + X-Forwarded-Prefix]
    #  Cada app reconstruye sus enlaces con el prefijo (X-Forwarded-Prefix).
    # ════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # Raíz → portal público
        location = / { return 302 /php/; }

        # ── /php → PHP-FPM (portal público) ────────────────────────────────────
        location = /php { return 301 /php/; }

        # PHP scripts: SCRIPT_FILENAME mapea quitando el prefijo /php.
        location ~ ^/php/(?<phpfile>.+?\.php)(/.*)?$ {
            limit_req zone=web burst=30 nodelay;
            set $upstream_fpm dms_php:9000;
            fastcgi_pass   $upstream_fpm;
            fastcgi_index  index.php;
            include        fastcgi_params;
            fastcgi_param  SCRIPT_FILENAME /var/www/html/$phpfile;
            fastcgi_param  SCRIPT_NAME /php/$phpfile;
            fastcgi_param  HTTP_X_FORWARDED_PREFIX /php;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        # Dir raíz del portal → index.php (lo procesa la location regex de .php)
        location = /php/ {
            rewrite ^ /php/index.php last;
        }

        # Estáticos del portal (css/js/img). Sin try_files (evita bug alias+fallback).
        location /php/ {
            limit_req zone=web burst=50 nodelay;
            alias /var/www/html/;
        }

        # ── /fastapi → FastAPI (motor de búsqueda) ─────────────────────────────
        location = /fastapi { return 301 /fastapi/; }
        location /fastapi/ {
            limit_req zone=api burst=20 nodelay;
            set $up_fastapi http://dms_fastapi:8000;
            rewrite ^/fastapi/(.*)$ /$1 break;
            proxy_pass         $up_fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   X-Forwarded-Prefix /fastapi;
            proxy_read_timeout 60s;
        }

        # ── /dotnet → .NET (gestión interna, SignalR) ──────────────────────────
        location = /dotnet { return 301 /dotnet/; }
        location /dotnet/ {
            limit_req zone=web burst=30 nodelay;
            set $up_dotnet http://dms_dotnet:8080;
            rewrite ^/dotnet/(.*)$ /$1 break;
            proxy_pass             $up_dotnet;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       X-Forwarded-Prefix /dotnet;
            proxy_read_timeout     120s;
            # WebSocket / SignalR
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
        }
    }

    # ════════════════════════════════════════════════════════════════════════════
    #  Acceso DIRECTO por puerto (compatibilidad / debug) — sin prefijo
    #  Las apps, al no recibir X-Forwarded-Prefix, emiten enlaces a la raíz.
    # ════════════════════════════════════════════════════════════════════════════

    # Puerto 8443: FastAPI (HTTPS directo)
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_fastapi http://dms_fastapi:8000;
            proxy_pass         $upstream_fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # Puerto 8084: .NET (HTTP directo)
    server {
        listen 8084;
        server_name _;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        location / {
            limit_req zone=web burst=30 nodelay;
            set $upstream_dotnet http://dms_dotnet:8080;
            proxy_pass             $upstream_dotnet;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       X-Forwarded-Host  $host;
            proxy_read_timeout     120s;
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
        }
    }
}
