worker_processes auto;

events {
    worker_connections 1024;
}

http {
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Puerto 80 — PublicDMS (PHP) ────────────────────────────────────────────
    server {
        listen 80;
        server_name _;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # PHP — todo (incluyendo /api/*.php que son APIs internas de PHP)
        location / {
            limit_req zone=web burst=30 nodelay;
            set $upstream_php http://php:80;
            proxy_pass         $upstream_php;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 60s;
        }
    }

    # ── Puerto 8443 — DMS Search Engine (FastAPI) ─────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_fastapi http://fastapi:8000;
            proxy_pass         $upstream_fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }
}
