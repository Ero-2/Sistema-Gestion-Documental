worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    limit_req_zone $binary_remote_addr zone=web:10m rate=60r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

    # ── Puerto 80: PublicDMS (PHP-FPM) ─────────────────────────────────────────
    server {
        listen 80;
        server_name _;
        root /var/www/html;
        index index.php;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header X-XSS-Protection       "1; mode=block" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        # Archivos estáticos servidos directamente
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|woff|woff2|svg|ttf|eot)$ {
            limit_req zone=web burst=50 nodelay;
            expires 1d;
            try_files $uri =404;
        }

        # PHP requests → PHP-FPM
        location ~ \.php$ {
            limit_req zone=web burst=30 nodelay;
            try_files $uri =404;
            fastcgi_split_path_info ^(.+\.php)(/.+)$;
            set $upstream_fpm php:9000;
            fastcgi_pass   $upstream_fpm;
            fastcgi_index  index.php;
            fastcgi_param  SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            fastcgi_param  PATH_INFO $fastcgi_path_info;
            include        fastcgi_params;
            fastcgi_read_timeout 60s;
            fastcgi_buffers 16 16k;
            fastcgi_buffer_size 32k;
        }

        location / {
            limit_req zone=web burst=30 nodelay;
            try_files $uri $uri/ /index.php?$query_string;
        }
    }

    # ── Puerto 443: Motor de Búsqueda (FastAPI) ────────────────────────────────
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        location / {
            limit_req zone=api burst=20 nodelay;
            set $upstream_fastapi http://fastapi:8000;
            proxy_pass         $upstream_fastapi;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto https;
            proxy_read_timeout 60s;
        }
    }

    # ── Puerto 8084: Sistema de Gestión (.NET) ─────────────────────────────────
    server {
        listen 8084;
        server_name _;

        add_header X-Frame-Options        "SAMEORIGIN"  always;
        add_header X-Content-Type-Options "nosniff"     always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        client_max_body_size 50M;

        location / {
            limit_req zone=web burst=30 nodelay;
            set $upstream_dotnet http://dotnet:8080;
            proxy_pass             $upstream_dotnet;
            proxy_set_header       Host              $host;
            proxy_set_header       X-Real-IP         $remote_addr;
            proxy_set_header       X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header       X-Forwarded-Proto $scheme;
            proxy_set_header       X-Forwarded-Host  $host;
            proxy_read_timeout     120s;
            # WebSocket / SignalR
            proxy_http_version     1.1;
            proxy_set_header       Upgrade    $http_upgrade;
            proxy_set_header       Connection "upgrade";
        }
    }
}
